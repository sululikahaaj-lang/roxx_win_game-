* name: Setup Node, uses: actions/setup-node@v4, with: node-version: 20, - name: Install dependencies, run: npm install, - name: Build game, run: npm run build, - name: Setup Pages, uses: actions/configure-pages@v5,
* name: Upload artifact, uses: actions/upload-pages-artifact@v3, with: path: ./dist, deploy: environment: name: github-pages, url: ${{ steps.deployment.outputs.page_url }}
